services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # TODO: pin to a specific image digest for reproducibility
    # e.g. mcr.microsoft.com/mssql/server:2022-CU13-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${AA_TASK_MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql
    healthcheck:
      # Per MS docs: grep errorlog for "ready for client connections" message
      # Avoids sqlcmd path uncertainty (moved from mssql-tools to mssql-tools18 in recent CUs)
      # https://learn.microsoft.com/en-us/sql/linux/quickstart-install-connect-docker?view=sql-server-ver17&tabs=cli&pivots=cs1-bash#view-list-of-containers-3
      test: ["CMD-SHELL", "cat /var/opt/mssql/log/errorlog | grep -q 'SQL Server is now ready for client connections'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrator:
    build: ./migrator
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    environment:
      AA_TASK_APP_PASSWORD: "${AA_TASK_APP_PASSWORD}"
      AA_TASK_MSSQL_SA_PASSWORD: "${AA_TASK_MSSQL_SA_PASSWORD}"

  app:
    build: ./app
    depends_on:
      migrator:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__SmrScheduler: "Server=db,1433;Database=SmrScheduler;User Id=smr_app;Password=${AA_TASK_APP_PASSWORD};TrustServerCertificate=True"
    volumes:
      - dataprotection-keys:/root/.aspnet/DataProtection-Keys

volumes:
  db_data:
  dataprotection-keys:
